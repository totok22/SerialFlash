name: CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release channel
        id: channel
        run: node .github/scripts/release-channel.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Check native serialport binding
        run: node tests/native-binding-smoke.mjs
      - name: Package platform-specific extension
        shell: bash
        env:
          PRE_RELEASE: ${{ steps.channel.outputs.pre_release }}
        run: |
          flags=()
          if [[ "$PRE_RELEASE" == "true" ]]; then flags+=(--pre-release); fi
          npx --yes @vscode/vsce@4.0.0 package --target ${{ matrix.target }} "${flags[@]}" --out serialflash-stm32-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: serialflash-stm32-${{ matrix.target }}.vsix
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release and VS Code Marketplace
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: publish-vscode-marketplace
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release channel
        id: channel
        run: node .github/scripts/release-channel.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE_RELEASE: ${{ steps.channel.outputs.pre_release }}
        run: |
          flags=()
          if [[ "$PRE_RELEASE" == "true" ]]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --prerelease="$PRE_RELEASE"
            gh release upload "$GITHUB_REF_NAME" dist/*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.vsix --verify-tag --title "SerialFlash $GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          fi
      - name: Check Entra federation configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::Set AZURE_CLIENT_ID and AZURE_TENANT_ID as GitHub Actions variables; see docs/RELEASING.md."
            exit 1
          fi
      - name: Login to Microsoft Entra ID (GitHub OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to VS Code Marketplace
        env:
          PRE_RELEASE: ${{ steps.channel.outputs.pre_release }}
        run: |
          flags=()
          if [[ "$PRE_RELEASE" == "true" ]]; then flags+=(--pre-release); fi
          npx --yes @vscode/vsce@4.0.0 publish --azure-credential --packagePath dist/*.vsix --skip-duplicate "${flags[@]}"
